DWAPlannerROS:
  # Robot Configuration
  max_vel_x: 0.3
  min_vel_x: -0.1
  max_vel_y: 0.0
  min_vel_y: 0.0
  max_vel_trans: 0.3
  min_vel_trans: 0.1
  max_vel_theta: 1.0
  min_vel_theta: 0.2
  acc_lim_x: 1.0
  acc_lim_y: 0.0
  acc_lim_theta: 2.0

  # Goal Tolerance
  yaw_goal_tolerance: 0.6
  xy_goal_tolerance: 0.20
  latch_xy_goal_tolerance: false

  # Forward Simulation
  sim_time: 1.5
  sim_granularity: 0.025
  vx_samples: 6
  vy_samples: 0
  vtheta_samples: 20

  # Trajectory Scoring
  path_distance_bias: 32.0
  goal_distance_bias: 40.0
  occdist_scale: 0.05
  forward_point_distance: 0.325
  stop_time_buffer: 0.2
  scaling_speed: 0.25
  max_scaling_factor: 0.2

  # Oscillation Prevention
  oscillation_reset_dist: 0.05
