obstacle_range: 2.5
raytrace_range: 3.0
robot_radius: 0.18
footprint_padding: 0.01

static_layer:
  map_topic: /map
  subscribe_to_updates: true

obstacle_layer:
  observation_sources: laser_scan_sensor
  laser_scan_sensor: {sensor_frame: laser, data_type: LaserScan, topic: /scan_filtered, marking: true, clearing: true, min_obstacle_height: 0.0, max_obstacle_height: 2.0, expected_update_rate: 0.0, observation_persistence: 0.0, inf_is_valid: false}

inflation_layer:
  inflation_radius: 0.15
  cost_scaling_factor: 5.0
